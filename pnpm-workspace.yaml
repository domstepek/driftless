packages:
  - packages/*
  - apps/*

catalog:
  "@types/minimatch": ^6.0.0
  "@types/node": ^22.19.15
  minimatch: ^10.2.4
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@0.1.11
  vite-plus: 0.1.11
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.11
  yaml: ^2.8.2

catalogMode: prefer

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
